version: "3.9"

# docker-compose file consistes of one or more service, this service runs inside of our docker file
services:
  app:
    # build the docker file inside of our current directory
    build:
      context: . 
      args:
        - DEV=true
    # connects ports on local machine to docker container
    ports:
      - "8000:8000"
    # mapping directory from system to container
    volumes:
      - ./app:/app
    # default command run on docker compose
    command: >
      sh -c "python manage.py wait_for_db && 
             python manage.py migrate && 
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=devdb
      - DB_USER=devuser
      - DB_PASS=changeme
    depends_on:
      - db

  db:
    image: postgres:13-alpine
    volumes: 
      - dev-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=devdb
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=changeme
    

volumes:
  dev-db-data:

